[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-energy-step-lab"
version = "0.1.0a1"
description = "FR: Mesurer la dérive énergétique des pas orbitaux | EN: Measure orbital integration energy drift | ES: Medir deriva energética de integración orbital"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
orbit-energy-step-lab = "orbit_energy_step_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["orbit_energy_step_lab*"]
